<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- pixelated ring-station "ship" cursor, Endurance-inspired -->
  <g stroke="#05080a" stroke-width="0.35">
    <rect x="6" y="1" width="4" height="1" fill="#eef7f0"/>
    <rect x="4" y="2" width="2" height="1" fill="#eef7f0"/>
    <rect x="10" y="2" width="2" height="1" fill="#eef7f0"/>
    <rect x="3" y="3" width="1" height="1" fill="#eef7f0"/>
    <rect x="12" y="3" width="1" height="1" fill="#eef7f0"/>
    <rect x="2" y="4" width="1" height="1" fill="#eef7f0"/>
    <rect x="13" y="4" width="1" height="1" fill="#eef7f0"/>
    <rect x="1" y="6" width="1" height="4" fill="#eef7f0"/>
    <rect x="14" y="6" width="1" height="4" fill="#eef7f0"/>
    <rect x="2" y="11" width="1" height="1" fill="#eef7f0"/>
    <rect x="13" y="11" width="1" height="1" fill="#eef7f0"/>
    <rect x="3" y="12" width="1" height="1" fill="#eef7f0"/>
    <rect x="12" y="12" width="1" height="1" fill="#eef7f0"/>
    <rect x="4" y="13" width="2" height="1" fill="#eef7f0"/>
    <rect x="10" y="13" width="2" height="1" fill="#eef7f0"/>
    <rect x="6" y="14" width="4" height="1" fill="#eef7f0"/>
    <!-- docking arms -->
    <rect x="0" y="7" width="1" height="2" fill="#57e08a"/>
    <rect x="15" y="7" width="1" height="2" fill="#57e08a"/>
    <!-- central hub / engine core -->
    <rect x="7" y="7" width="2" height="2" fill="#f2c14e"/>
  </g>
</svg>
